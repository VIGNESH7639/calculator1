<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ebe4; --body:#d3dbd1; --display:#1d292c; --display-text:#e9f1ea; --muted:#8fa5a3;
  --key:#f6f8f4; --key-text:#1d292c; --op:#2f5d62; --op-text:#f1f7f5; --fn:#bccbc6; --eq:#e2b23c; --eq-text:#2a2008;
  --tape:#f6f8f4; --line:#c3cfc3; --focus:#2f5d62;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a1b; --body:#1b2527; --display:#0b1011; --display-text:#e9f1ea; --muted:#6f8887;
    --key:#26343a; --key-text:#e9f1ea; --op:#3f7a80; --op-text:#f1f7f5; --fn:#31444a; --eq:#e2b23c; --eq-text:#2a2008;
    --tape:#1b2527; --line:#2c3c3f; --focus:#e2b23c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a1b; --body:#1b2527; --display:#0b1011; --display-text:#e9f1ea; --muted:#6f8887;
  --key:#26343a; --key-text:#e9f1ea; --op:#3f7a80; --op-text:#f1f7f5; --fn:#31444a; --eq:#e2b23c; --eq-text:#2a2008;
  --tape:#1b2527; --line:#2c3c3f; --focus:#e2b23c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--key-text);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;display:flex;justify-content:center;padding:24px 16px}
main{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:center;width:100%;max-width:760px}
.calc{background:var(--body);border-radius:28px;padding:18px;width:100%;max-width:360px;box-shadow:0 18px 40px rgba(20,40,40,.18)}
.screen{background:var(--display);color:var(--display-text);border-radius:16px;padding:14px 18px 12px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden}
.expr{color:var(--muted);font-size:15px;min-height:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.value{font-size:44px;font-weight:500;line-height:1.15;max-width:100%;overflow-x:auto;white-space:nowrap;letter-spacing:-.01em}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
button{font:inherit;font-size:22px;font-weight:500;border:0;border-radius:16px;height:62px;cursor:pointer;background:var(--key);color:var(--key-text);transition:transform .08s ease,filter .15s}
button:active{transform:scale(.95)}
button:hover{filter:brightness(.96)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.fn{background:var(--fn)} .op{background:var(--op);color:var(--op-text)} .eq{background:var(--eq);color:var(--eq-text)}
.tape{background:var(--tape);border:1px solid var(--line);border-radius:20px;padding:16px;width:100%;max-width:340px;flex:1 1 260px}
.tape h2{font-size:16px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.tape h2 button{height:auto;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--fn);color:var(--key-text)}
.tape ul{list-style:none;margin:0;padding:0;max-height:360px;overflow-y:auto}
.tape li button{all:unset;display:block;width:100%;cursor:pointer;padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;box-sizing:border-box}
.tape li button:focus-visible{outline:3px solid var(--focus)}
.tape .e{display:block;font-size:13px;color:var(--muted)}
.tape .r{display:block;font-size:19px;font-weight:500}
.empty{color:var(--muted);font-size:14px;margin:0}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
  <section class="calc" aria-label="Calculator">
    <div class="screen" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn" data-k="clear">AC</button>
      <button class="fn" data-k="neg" aria-label="Change sign">±</button>
      <button class="fn" data-k="pct" aria-label="Percent">%</button>
      <button class="op" data-k="/" aria-label="Divide">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="op" data-k="*" aria-label="Multiply">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button class="op" data-k="-" aria-label="Subtract">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button class="op" data-k="+" aria-label="Add">+</button>
      <button data-k="0">0</button>
      <button data-k=".">.</button>
      <button class="fn" data-k="back" aria-label="Delete last digit">⌫</button>
      <button class="eq" data-k="=" aria-label="Equals">=</button>
    </div>
  </section>
  <aside class="tape" aria-label="History">
    <h2>History <button id="clearTape" type="button">Clear</button></h2>
    <ul id="tape"></ul>
    <p class="empty" id="empty">Your calculations will appear here.</p>
  </aside>
</main>
<script>
(function(){
  var cur="0", prev=null, op=null, fresh=false, err=false, history=[];
  var sym={"+":"+","-":"−","*":"×","/":"÷"};
  var $v=document.getElementById("value"), $e=document.getElementById("expr");
  var $t=document.getElementById("tape"), $empty=document.getElementById("empty");

  function fmt(s){
    if(err) return s;
    var neg=s[0]==="-", b=neg?s.slice(1):s, p=b.split(".");
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
    return (neg?"-":"")+p.join(".");
  }
  function clean(n){
    if(!isFinite(n)) return null;
    var s=String(parseFloat(n.toPrecision(12)));
    if(s.indexOf("e")>-1) s=n.toExponential(6);
    return s;
  }
  function calc(a,b,o){
    a=parseFloat(a); b=parseFloat(b);
    var r = o==="+"?a+b : o==="-"?a-b : o==="*"?a*b : b===0?NaN:a/b;
    return clean(r);
  }
  function render(){
    $v.textContent=fmt(cur);
    $e.textContent = prev!==null&&op ? fmt(prev)+" "+sym[op]+(fresh?"":"") : "";
  }
  function fail(){ cur="Can’t divide by zero"; err=true; prev=null; op=null; fresh=true; render(); }
  function digit(d){
    if(err) reset();
    if(fresh){ cur=d; fresh=false; }
    else if(cur==="0") cur=d;
    else if(cur.replace(/[-.]/g,"").length<15) cur+=d;
    render();
  }
  function dot(){
    if(err) reset();
    if(fresh){ cur="0."; fresh=false; }
    else if(cur.indexOf(".")<0) cur+=".";
    render();
  }
  function reset(){ cur="0"; prev=null; op=null; fresh=false; err=false; render(); }
  function operator(o){
    if(err) return;
    if(op && !fresh){
      var r=calc(prev,cur,op); if(r===null) return fail();
      prev=r; cur=r;
    } else prev=cur;
    op=o; fresh=true; render();
  }
  function equals(){
    if(err||!op) return;
    var r=calc(prev,cur,op); if(r===null) return fail();
    addHistory(fmt(prev)+" "+sym[op]+" "+fmt(cur), r);
    cur=r; prev=null; op=null; fresh=true; render();
  }
  function neg(){ if(err||cur==="0") return; cur=cur[0]==="-"?cur.slice(1):"-"+cur; render(); }
  function pct(){ if(err) return; var r=clean(parseFloat(cur)/100); if(r!==null){cur=r; fresh=true;} render(); }
  function back(){
    if(err) return reset();
    if(fresh) return;
    cur=cur.length>1&&!(cur.length===2&&cur[0]==="-")?cur.slice(0,-1):"0"; render();
  }
  function addHistory(expr,res){
    history.unshift({expr:expr,res:res}); if(history.length>30) history.pop(); drawTape();
  }
  function drawTape(){
    $t.innerHTML=""; $empty.style.display=history.length?"none":"block";
    history.forEach(function(h){
      var li=document.createElement("li"), b=document.createElement("button");
      b.type="button"; b.setAttribute("aria-label","Use result "+h.res);
      b.innerHTML='<span class="e"></span><span class="r"></span>';
      b.children[0].textContent=h.expr+" ="; b.children[1].textContent=fmt(h.res);
      b.onclick=function(){ cur=h.res; prev=null; op=null; fresh=true; err=false; render(); };
      li.appendChild(b); $t.appendChild(li);
    });
  }
  function press(k){
    if(k>="0"&&k<="9"&&k.length===1) digit(k);
    else if(k===".") dot();
    else if("+-*/".indexOf(k)>-1) operator(k);
    else if(k==="=") equals();
    else if(k==="clear") reset();
    else if(k==="neg") neg();
    else if(k==="pct") pct();
    else if(k==="back") back();
  }
  document.getElementById("keys").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(b) press(b.dataset.k);
  });
  document.getElementById("clearTape").onclick=function(){ history=[]; drawTape(); };
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var k=e.key;
    if(/^[0-9]$/.test(k)||k==="."||"+-*/".indexOf(k)>-1) press(k);
    else if(k==="Enter"||k==="="){ e.preventDefault(); press("="); }
    else if(k==="Backspace") press("back");
    else if(k==="Escape"||k==="c"||k==="C") press("clear");
    else if(k==="%") press("pct");
  });
  render(); drawTape();
})();
</script>
</body>
</html>
